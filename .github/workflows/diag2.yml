name: macOS Runner Matrix

# 逐个试 macOS 镜像标签，找出哪个能真正分配 runner
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  m13:
    runs-on: macos-13
    continue-on-error: true
    steps:
      - run: echo "macos-13 OK"; xcodebuild -version

  m14:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - run: echo "macos-14 OK"; xcodebuild -version

  m15:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - run: echo "macos-15 OK"; xcodebuild -version

  mlatest:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - run: echo "macos-latest OK"; xcodebuild -version

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "ubuntu baseline OK"
