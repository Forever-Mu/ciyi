name: Build unsigned IPA

# 手动触发，或推到 main 时自动跑
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # 注意：macos-14 对部分账号不可用（job 会在分配 runner 前被 cancel，
    # 表现为 0 步骤、runner 为空）。macos-15 / macos-latest 可用。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 准备网页资源
        run: |
          chmod +x ios/scripts/prepare-www.sh
          ./ios/scripts/prepare-www.sh

      - name: 确认 www 目录结构
        run: |
          find ios/www -type f | sort
          echo "-----"
          du -sh ios/www

      - name: 生成 Xcode 工程
        run: |
          cd ios
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        run: |
          cd ios
          xcodebuild \
            -project CiYi.xcodeproj \
            -scheme CiYi \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -quiet

      - name: 确认产物存在
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/CiYi.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没有找到 $APP"
            find ios/build -name "*.app" -maxdepth 8 || true
            exit 1
          fi
          echo "产物："
          ls -la "$APP"
          echo "可执行文件："
          file "$APP/CiYi" || true

      - name: 打包成 .ipa
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/CiYi.app"
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry CiYi-unsigned.ipa Payload
          echo "IPA 大小："
          ls -la CiYi-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CiYi-unsigned-ipa
          path: out/CiYi-unsigned.ipa
          if-no-files-found: error
