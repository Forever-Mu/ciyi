<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4f46e5">
<title>词忆 · 智能英语单词记忆</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>

<!-- 启动遮罩 -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-logo">词忆</div>
    <div class="boot-text" id="bootText">正在加载本地词库…</div>
    <div class="boot-bar"><i id="bootBar"></i></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="topbar-title">
      <h1 id="pageTitle">今日</h1>
      <p id="pageSub"></p>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
    </button>
  </header>

  <main class="screen" id="screen"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-route="study">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4 4.5 4v13C8 17 10.5 18 12 19.5 13.5 18 16 17 19.5 17V4C16 4 13.5 5 12 6.5Z"/><path d="M12 6.5v13"/></svg>
      <span>学习</span>
    </button>
    <button class="tab" data-route="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>
      <span>词库</span>
    </button>
    <button class="tab" data-route="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>统计</span>
    </button>
    <button class="tab" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/></svg>
      <span>设置</span>
    </button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="vendor/sql-wasm.js"></script>
<script src="vendor/fflate.js"></script>
<script type="module" src="web/app.js"></script>
</body>
</html>
